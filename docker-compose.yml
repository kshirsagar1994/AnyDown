version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anydown-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - FRONTEND_ORIGIN=http://localhost:3000
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - TEMP_DIR=/app/tmp
      - MAX_DOWNLOAD_BYTES=524288000
      - FILE_RETENTION_SECONDS=900
    volumes:
      - anydown_tmp:/app/tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anydown-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  anydown_tmp:

