services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anydown-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - FRONTEND_ORIGIN=*
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - TEMP_DIR=/app/tmp
      - MAX_DOWNLOAD_BYTES=524288000
      - FILE_RETENTION_SECONDS=900
      - COOKIES_FILE_PATH=/app/secrets/cookies.txt
    volumes:
      - anydown_tmp:/app/tmp
      - ./secrets:/app/secrets:rw

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=
    container_name: anydown-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: anydown-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

volumes:
  anydown_tmp:
